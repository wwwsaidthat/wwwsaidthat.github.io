# Put this block inside the HTTPS virtual host for demo-api.example.edu.
# TLS certificates should be configured with your institution's normal process.
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 900s;
}
